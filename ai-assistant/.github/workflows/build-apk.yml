name: Build My AI APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai-assistant/android-app/**'
      - 'ai-assistant/.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-assistant/android-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --project-name my_ai_assistant .

      - name: Add Internet permission
        working-directory: ai-assistant/android-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>\n'
          if permission not in s:
              s = s.replace('<manifest ', '<manifest ', 1)
              marker = 'xmlns:android="http://schemas.android.com/apk/res/android">'
              s = s.replace(marker, marker + '\n    ' + permission)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://myaiassistent.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-release-apk
          path: ai-assistant/android-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
